name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Run bandit
        # -r apps/  — scan only app code, not test files or migrations
        # -ll       — report only medium and high severity issues
        # Exclude test directories and migrations (bandit -x uses path prefixes)
        run: bandit -r apps/ -ll --skip B101,B106,B108,B311 -x apps/accounts/tests,apps/api/tests,apps/clients/tests,apps/curation/tests,apps/dishes/tests,apps/ingredients/tests,apps/nutrition/tests,apps/search/tests,apps/accounts/migrations,apps/clients/migrations,apps/dietary/migrations,apps/dishes/migrations,apps/ingredients/migrations,apps/nutrition/migrations,apps/pairings/migrations,apps/regions/migrations,apps/substitutions/migrations

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Run pip-audit
        run: |
          pip-audit -r requirements/base.txt -r requirements/prod.txt \
            --ignore-vuln PYSEC-2026-3717 \
            --ignore-vuln PYSEC-2026-4035 \
            --ignore-vuln GHSA-923m-gv2p-w5qp \
            --ignore-vuln GHSA-h7pc-vwp9-298g \
            --ignore-vuln GHSA-8cjm-8mp7-r2xf \
            --ignore-vuln GHSA-3h9f-r86x-qvjx \
            --ignore-vuln GHSA-crhf-3pfg-w68w \
            --ignore-vuln GHSA-8qcx-xf44-272x \
            --ignore-vuln GHSA-33wh-fxxf-88vv \
            --ignore-vuln GHSA-3547-9m27-7rxg \
            --ignore-vuln GHSA-xw6w-gcfp-cf8m
          # Django 5.1.15 CVEs above are fixed in 5.2.x only (no 5.1 backport).
          # DRF 3.17.2 CVEs are fixed in 3.18.x only.
          # Pillow upgraded to 13.0.0 which has no known CVEs.

  test:
    name: Tests with coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ff_engine_test
          POSTGRES_USER: ff_engine
          POSTGRES_PASSWORD: ff_engine_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Enable pg_trgm extension
        env:
          PGPASSWORD: ff_engine_pass
        run: |
          # Enable pg_trgm on the main DB
          psql -h localhost -U ff_engine -d ff_engine_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          # Pre-create the test DB that pytest-django will use (test_ff_engine_test)
          # and install pg_trgm on it so the CONCURRENTLY migration succeeds.
          psql -h localhost -U ff_engine -d postgres -c "CREATE DATABASE test_ff_engine_test OWNER ff_engine;" || true
          psql -h localhost -U ff_engine -d test_ff_engine_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://ff_engine:ff_engine_pass@localhost:5432/ff_engine_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-not-for-production
          ENGINE_VERSION: ci
          DATASET_VERSION: 0.0.0
        run: pytest --cov --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

  migration-check:
    name: Migration check
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ff_engine_test
          POSTGRES_USER: ff_engine
          POSTGRES_PASSWORD: ff_engine_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Check for missing migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://ff_engine:ff_engine_pass@localhost:5432/ff_engine_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-not-for-production
        run: |
          # Apply all migrations to the fresh CI database
          python manage.py migrate --no-input
          # Check that no model changes are missing a migration file
          python manage.py makemigrations --check --dry-run --no-input

  schema-validation:
    name: OpenAPI schema validation
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ff_engine_test
          POSTGRES_USER: ff_engine
          POSTGRES_PASSWORD: ff_engine_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Validate OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://ff_engine:ff_engine_pass@localhost:5432/ff_engine_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-not-for-production
          ENGINE_VERSION: ci
          DATASET_VERSION: 0.0.0
        run: |
          python manage.py spectacular --validate
