name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # E1 skeleton — proves CI runs and blocks a bad PR.
  # Full lint, type checks and tests are added in E2
  # when requirements and the Django project exist.
  ci-check:
    name: CI check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm CI is running
        run: echo "CI skeleton active. Full checks land in E2."
