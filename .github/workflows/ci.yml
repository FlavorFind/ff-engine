name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Upgraded in E2: verifies all dependencies install cleanly.
  # Lint and full test suite added in E3 when the Django project exists.
  ci-check:
    name: CI check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify dependencies install cleanly
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          echo "All dependencies installed successfully."
