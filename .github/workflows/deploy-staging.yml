name: Deploy to Staging

# Deploys to the self-hosted Lenovo ThinkPad staging server via Tailscale + SSH.
# Gate: CI must pass before deploy runs.
# Verify: smoke test runs on the server itself (avoids Cloudflare blocking GitHub IPs).

on:
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. CI gate
  # ──────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI gate (lint + tests + migrations)
    uses: ./.github/workflows/ci.yml

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Deploy + verify (runs on server via SSH — not affected by Cloudflare)
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to staging server
    runs-on: ubuntu-latest
    needs: ci-gate
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 300s
          script: |
            set -euo pipefail
            cd /home/mayday/ff-engine

            echo "=== [1/5] Pull latest code ==="
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main

            echo "=== [2/5] Install/update dependencies ==="
            .venv/bin/pip install -q -r requirements/prod.txt --prefer-binary

            echo "=== [3/5] Run migrations ==="
            DJANGO_SETTINGS_MODULE=config.settings.prod \
              .venv/bin/python manage.py migrate --no-input

            echo "=== [4/5] Collect static files ==="
            DJANGO_SETTINGS_MODULE=config.settings.prod \
              .venv/bin/python manage.py collectstatic --no-input --clear

            echo "=== [5/5] Reload Gunicorn ==="
            sudo systemctl reload ff-engine || sudo systemctl restart ff-engine
            sleep 5
            sudo systemctl is-active ff-engine

            echo "=== Smoke test (local) ==="
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "X-API-Key: ffk_71fbe13c18afb9e92785eaff86db4f9c1b50c781" \
              http://127.0.0.1:8000/v1/health/)
            echo "Health: $STATUS"
            [ "$STATUS" = "200" ] || exit 1

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST http://127.0.0.1:8000/v1/search/by-ingredients \
              -H "Content-Type: application/json" \
              -H "X-API-Key: ffk_71fbe13c18afb9e92785eaff86db4f9c1b50c781" \
              -d '{"ingredients":["tomato","onion"]}')
            echo "Search: $STATUS"
            [ "$STATUS" = "200" ] || exit 1

            echo "Deploy complete ✓"
