name: Deploy to Staging

# Render auto-deploys on every push to main (Auto-Deploy: On Commit).
# This workflow records the deploy in the GitHub Actions audit trail
# and verifies the staging health endpoint after deploy.

on:
  push:
    branches: [main]

jobs:
  verify-staging:
    name: Verify staging health after deploy
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Wait for Render deploy to complete
        # Render typically takes 2-3 minutes to build and deploy
        run: sleep 180

      - name: Check staging health endpoint
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            https://ff-engine-kuar.onrender.com/v1/health/)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Staging health check failed with status $STATUS"
            exit 1
          fi
          echo "Staging is healthy ✓"

      - name: Print staging URL
        run: |
          echo "Staging URL: https://ff-engine-kuar.onrender.com"
          echo "Admin:       https://ff-engine-kuar.onrender.com/admin/"
          echo "API docs:    https://ff-engine-kuar.onrender.com/docs/"
