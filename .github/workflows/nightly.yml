name: Nightly checks

on:
  schedule:
    - cron: "0 1 * * *"  # 1 AM UTC = 4 AM Nairobi time
  workflow_dispatch:      # allow manual trigger

jobs:
  nightly:
    name: Nightly — migrate, seed, golden set, QA
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ff_engine_test
          POSTGRES_USER: ff_engine
          POSTGRES_PASSWORD: ff_engine_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Migrate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://ff_engine:ff_engine_pass@localhost:5432/ff_engine_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-not-for-production
        run: python manage.py migrate --noinput

      - name: Seed and promote data
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://ff_engine:ff_engine_pass@localhost:5432/ff_engine_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-not-for-production
        run: |
          # seed_all promotes seeded dishes/ingredients to status=reviewed
          # automatically (no --dry-run flag). QA steps below only see live data.
          python manage.py seed_all --env test

      - name: Golden set
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://ff_engine:ff_engine_pass@localhost:5432/ff_engine_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-not-for-production
        run: python manage.py run_golden_set --json

      - name: QA report
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://ff_engine:ff_engine_pass@localhost:5432/ff_engine_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-not-for-production
        run: |
          if python manage.py help qa_report >/dev/null 2>&1; then
            python manage.py qa_report --fail-on-critical
          else
            echo "::notice::qa_report not yet built — skipping"
          fi
