name: Release

on:
  push:
    tags:
      - "v*.*.*"       # engine releases e.g. v1.0.0
      - "data-*"       # dataset releases e.g. data-2026.12.0

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    environment: production  # requires manual approval from a reviewer

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/prod.txt

      - name: Run full test suite before release
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          REDIS_URL: ${{ secrets.TEST_REDIS_URL }}
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
        run: pytest --tb=short -q

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t ff-engine:${{ github.ref_name }} .

      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          DEPLOY_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          echo "Production deploy for ${{ github.ref_name }} — wire up SSH deploy here in E7"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
