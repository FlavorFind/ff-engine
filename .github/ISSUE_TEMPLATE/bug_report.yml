name: Bug report
description: Report a bug in the engine code or API
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "## Bug report"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Call POST /v1/search/by-ingredients with ...
        2. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Engine version / dataset version
      placeholder: e.g. v1.0.0 / 2026.12.0
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (wrong allergen result, data leak)
        - High (wrong match result)
        - Medium (UI or API inconsistency)
        - Low (cosmetic, docs)
    validations:
      required: true
