---
# Render infrastructure-as-code — E7 staging environment.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ff-engine
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements/prod.txt && python manage.py fix_migration_history && python manage.py migrate --no-input && python manage.py collectstatic --no-input && python manage.py seed_all --env prod && python manage.py ensure_superuser
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flavorfind-engine-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ff-engine-kuar.onrender.com
      - key: DEBUG
        value: "false"
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: ENGINE_VERSION
        value: "1.0.0"
      - key: DATASET_VERSION
        value: "1.0.0"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://ff-engine-kuar.onrender.com"
      - key: SENTRY_DSN
        value: ""

databases:
  - name: flavorfind-engine-db
    databaseName: flavorfind_engine_db
    plan: free
    region: frankfurt
